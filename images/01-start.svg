<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">01 / 手动初始化桌宠</title><desc id="desc">在 DesktopPetActor 子蓝图中；类默认值 bAutoStart = false。各函数 Target 均为 Self。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0 H0 V24" fill="none" stroke="#253447" stroke-width=".5"/></pattern></defs>
<rect width="1200" height="540" fill="#0e1824"/><rect width="1200" height="540" fill="url(#grid)"/>
<g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#f4f8fc">
<text x="30" y="38" font-size="24" font-weight="700">01 / 手动初始化桌宠</text>
<text x="30" y="70" font-size="15" fill="#afc1d2">在 DesktopPetActor 子蓝图中；类默认值 bAutoStart = false。各函数 Target 均为 Self。</text>
<path d="M320 135 C380 135 350 135 410 135" fill="none" stroke="#edf3fa" stroke-width="3"/><circle cx="320" cy="135" r="5" fill="#edf3fa"/><circle cx="410" cy="135" r="5" fill="#edf3fa"/><path d="M740 135 C800 135 770 135 830 135" fill="none" stroke="#edf3fa" stroke-width="3"/><circle cx="740" cy="135" r="5" fill="#edf3fa"/><circle cx="830" cy="135" r="5" fill="#edf3fa"/><path d="M995 281 V315 H995 V355" fill="none" stroke="#edf3fa" stroke-width="3"/><circle cx="995" cy="281" r="5" fill="#edf3fa"/><circle cx="995" cy="355" r="5" fill="#edf3fa"/><g transform="translate(30 110)"><rect width="290" height="81" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H282 Q290 0 290 8 V38 H0 V8 Q0 0 8 0" fill="#74313f"/><text x="15" y="25" font-size="14" font-weight="700">Event BeginPlay</text><text x="16" y="64" font-size="14" fill="#dce7f2">先取得项目生成的角色引用</text></g><g transform="translate(410 110)"><rect width="330" height="107" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H322 Q330 0 330 8 V38 H0 V8 Q0 0 8 0" fill="#265e85"/><text x="15" y="25" font-size="14" font-weight="700">PetAddVisibleActor</text><text x="16" y="64" font-size="14" fill="#dce7f2">Target = Self</text><text x="16" y="90" font-size="14" fill="#dce7f2">Actor ← 项目角色实例</text></g><g transform="translate(830 110)"><rect width="330" height="133" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H322 Q330 0 330 8 V38 H0 V8 Q0 0 8 0" fill="#265e85"/><text x="15" y="25" font-size="14" font-weight="700">PetSetOrbitFocusActor</text><text x="16" y="64" font-size="14" fill="#dce7f2">Target = Self</text><text x="16" y="90" font-size="14" fill="#dce7f2">Actor ← 同一个角色</text><text x="16" y="116" font-size="14" fill="#dce7f2">bKeepCurrentView = true</text></g><g transform="translate(830 355)"><rect width="330" height="107" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H322 Q330 0 330 8 V38 H0 V8 Q0 0 8 0" fill="#265e85"/><text x="15" y="25" font-size="14" font-weight="700">PetStartDesktopWindow</text><text x="16" y="64" font-size="14" fill="#dce7f2">Target = Self</text><text x="16" y="90" font-size="14" fill="#dce7f2">Return Value → 检查是否启动成功</text></g><text x="40" y="360" font-size="15" fill="#73cff3">角色引用来自项目：Spawn Actor 的返回值，或关卡中预先填写的对象变量。</text><text x="40" y="394" font-size="15" fill="#afc1d2">若保持 bAutoStart = true，可在 BeginPlay 中准备名单和相机，随后由 C++ 自动启动。</text><text x="40" y="428" font-size="15" fill="#afc1d2">自动启动与手动启动选择一种；重复 Start 返回 false，不会再创建一份窗口。</text>
<text x="30" y="518" fill="#8fa7bd" font-size="13">白线：执行顺序　蓝线：对象或结构体　红线：布尔值　图中为接线示意，节点名称对应插件接口</text>
</g></svg>