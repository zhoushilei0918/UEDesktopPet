<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">03 / 对接项目自己的拖拽输入</title><desc id="desc">以 Enhanced Input 为例；插件提供拖拽接口，不负责创建 Mapping Context 或注入 IA。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0 H0 V24" fill="none" stroke="#253447" stroke-width=".5"/></pattern></defs>
<rect width="1200" height="540" fill="#0e1824"/><rect width="1200" height="540" fill="url(#grid)"/>
<g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#f4f8fc">
<text x="30" y="38" font-size="24" font-weight="700">03 / 对接项目自己的拖拽输入</text>
<text x="30" y="70" font-size="15" fill="#afc1d2">以 Enhanced Input 为例；插件提供拖拽接口，不负责创建 Mapping Context 或注入 IA。</text>
<path d="M380 194 C440 194 590 140 650 140" fill="none" stroke="#edf3fa" stroke-width="3"/><circle cx="380" cy="194" r="5" fill="#edf3fa"/><circle cx="650" cy="140" r="5" fill="#edf3fa"/><path d="M380 220 C440 220 590 355 650 355" fill="none" stroke="#edf3fa" stroke-width="3"/><circle cx="380" cy="220" r="5" fill="#edf3fa"/><circle cx="650" cy="355" r="5" fill="#edf3fa"/><path d="M380 246 C440 246 590 355 650 355" fill="none" stroke="#edf3fa" stroke-width="3"/><circle cx="380" cy="246" r="5" fill="#edf3fa"/><circle cx="650" cy="355" r="5" fill="#edf3fa"/><g transform="translate(40 130)"><rect width="340" height="133" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H332 Q340 0 340 8 V38 H0 V8 Q0 0 8 0" fill="#74313f"/><text x="15" y="25" font-size="14" font-weight="700">IA_Drag（项目输入事件）</text><text x="16" y="64" font-size="14" fill="#dce7f2">Started</text><text x="16" y="90" font-size="14" fill="#dce7f2">Completed</text><text x="16" y="116" font-size="14" fill="#dce7f2">Canceled</text></g><g transform="translate(650 115)"><rect width="330" height="107" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H322 Q330 0 330 8 V38 H0 V8 Q0 0 8 0" fill="#265e85"/><text x="15" y="25" font-size="14" font-weight="700">PetBeginWindowDrag</text><text x="16" y="64" font-size="14" fill="#dce7f2">Target = PetRef</text><text x="16" y="90" font-size="14" fill="#dce7f2">Return Value：是否已进入拖拽</text></g><g transform="translate(650 330)"><rect width="330" height="107" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H322 Q330 0 330 8 V38 H0 V8 Q0 0 8 0" fill="#265e85"/><text x="15" y="25" font-size="14" font-weight="700">PetEndWindowDrag</text><text x="16" y="64" font-size="14" fill="#dce7f2">Target = PetRef</text><text x="16" y="90" font-size="14" fill="#dce7f2">结束并释放插件的拖拽状态</text></g><text x="40" y="415" font-size="15" fill="#afc1d2">保证 IA 在项目中确实能收到输入；隐藏的 UE 主窗口不会自动获得桌宠窗口的输入。</text><text x="40" y="447" font-size="15" fill="#afc1d2">默认人物左键拖动已经由插件处理。自定义 UMG 拖拽把手也可在按下 / 抬起时调用这两个函数。</text><text x="40" y="479" font-size="15" fill="#afc1d2">前提：窗口运行、bDraggable = true、菜单未打开、未收进托盘。</text>
<text x="30" y="518" fill="#8fa7bd" font-size="13">白线：执行顺序　蓝线：对象或结构体　红线：布尔值　图中为接线示意，节点名称对应插件接口</text>
</g></svg>