<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">06 / 收进系统托盘，再双击恢复</title><desc id="desc">UMG 按钮只调用宿主接口；托盘图标、双击恢复和窗口隐藏由插件完成。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0 H0 V24" fill="none" stroke="#253447" stroke-width=".5"/></pattern></defs>
<rect width="1200" height="560" fill="#0e1824"/><rect width="1200" height="560" fill="url(#grid)"/>
<g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#f4f8fc">
<text x="30" y="38" font-size="24" font-weight="700">06 / 收进系统托盘，再双击恢复</text>
<text x="30" y="70" font-size="15" fill="#afc1d2">UMG 按钮只调用宿主接口；托盘图标、双击恢复和窗口隐藏由插件完成。</text>
<path d="M380 135 C440 135 390 135 450 135" fill="none" stroke="#edf3fa" stroke-width="3"/><circle cx="380" cy="135" r="5" fill="#edf3fa"/><circle cx="450" cy="135" r="5" fill="#edf3fa"/><path d="M780 135 C840 135 790 135 850 135" fill="none" stroke="#edf3fa" stroke-width="3"/><circle cx="780" cy="135" r="5" fill="#edf3fa"/><circle cx="850" cy="135" r="5" fill="#edf3fa"/><path d="M780 200 C840 200 790 200 850 200" fill="none" stroke="#ed7a89" stroke-width="3"/><circle cx="780" cy="200" r="5" fill="#ed7a89"/><circle cx="850" cy="200" r="5" fill="#ed7a89"/><path d="M380 365 C440 365 390 365 450 365" fill="none" stroke="#edf3fa" stroke-width="3"/><circle cx="380" cy="365" r="5" fill="#edf3fa"/><circle cx="450" cy="365" r="5" fill="#edf3fa"/><path d="M780 365 C840 365 790 365 850 365" fill="none" stroke="#edf3fa" stroke-width="3"/><circle cx="780" cy="365" r="5" fill="#edf3fa"/><circle cx="850" cy="365" r="5" fill="#edf3fa"/><g transform="translate(30 110)"><rect width="350" height="81" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H342 Q350 0 350 8 V38 H0 V8 Q0 0 8 0" fill="#74313f"/><text x="15" y="25" font-size="14" font-weight="700">OnClicked（项目托盘按钮）</text><text x="16" y="64" font-size="14" fill="#dce7f2">PetRef 指向正在运行的桌宠</text></g><g transform="translate(450 110)"><rect width="330" height="107" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H322 Q330 0 330 8 V38 H0 V8 Q0 0 8 0" fill="#265e85"/><text x="15" y="25" font-size="14" font-weight="700">PetHideToTray</text><text x="16" y="64" font-size="14" fill="#dce7f2">Target = PetRef</text><text x="16" y="90" font-size="14" fill="#dce7f2">Return Value → Branch.Condition</text></g><g transform="translate(850 110)"><rect width="320" height="107" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H312 Q320 0 320 8 V38 H0 V8 Q0 0 8 0" fill="#5d4a2f"/><text x="15" y="25" font-size="14" font-weight="700">Branch</text><text x="16" y="64" font-size="14" fill="#dce7f2">True：收起成功</text><text x="16" y="90" font-size="14" fill="#dce7f2">False：保留当前界面并处理失败</text></g><g transform="translate(30 340)"><rect width="350" height="81" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H342 Q350 0 350 8 V38 H0 V8 Q0 0 8 0" fill="#74313f"/><text x="15" y="25" font-size="14" font-weight="700">系统托盘图标双击</text><text x="16" y="64" font-size="14" fill="#dce7f2">Windows 发出恢复请求</text></g><g transform="translate(450 340)"><rect width="330" height="107" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H322 Q330 0 330 8 V38 H0 V8 Q0 0 8 0" fill="#265e85"/><text x="15" y="25" font-size="14" font-weight="700">PetRestoreFromTray</text><text x="16" y="64" font-size="14" fill="#dce7f2">插件自动调用</text><text x="16" y="90" font-size="14" fill="#dce7f2">项目也可手动调用</text></g><g transform="translate(850 340)"><rect width="320" height="107" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H312 Q320 0 320 8 V38 H0 V8 Q0 0 8 0" fill="#74313f"/><text x="15" y="25" font-size="14" font-weight="700">PetEventTrayStateChanged</text><text x="16" y="64" font-size="14" fill="#dce7f2">bHiddenToTray = false</text><text x="16" y="90" font-size="14" fill="#dce7f2">按需恢复项目自己的业务</text></g><text x="40" y="500" font-size="15" fill="#afc1d2">收起时同一状态事件传 true；不会销毁角色或自动停止音乐，项目可按需求自行处理。</text>
<text x="30" y="538" fill="#8fa7bd" font-size="13">白线：执行顺序　蓝线：对象或结构体　红线：布尔值　图中为接线示意，节点名称对应插件接口</text>
</g></svg>