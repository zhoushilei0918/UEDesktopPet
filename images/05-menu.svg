<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">05 / 菜单收回动画完成后再关闭</title><desc id="desc">UMG 实现 DesktopPetMenuInterface，并由项目给 UMG 的 PetRef 变量传入所属桌宠。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0 H0 V24" fill="none" stroke="#253447" stroke-width=".5"/></pattern></defs>
<rect width="1200" height="690" fill="#0e1824"/><rect width="1200" height="690" fill="url(#grid)"/>
<g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#f4f8fc">
<text x="30" y="38" font-size="24" font-weight="700">05 / 菜单收回动画完成后再关闭</text>
<text x="30" y="70" font-size="15" fill="#afc1d2">UMG 实现 DesktopPetMenuInterface，并由项目给 UMG 的 PetRef 变量传入所属桌宠。</text>
<path d="M360 135 C420 135 375 135 435 135" fill="none" stroke="#edf3fa" stroke-width="3"/><circle cx="360" cy="135" r="5" fill="#edf3fa"/><circle cx="435" cy="135" r="5" fill="#edf3fa"/><path d="M390 345 C450 345 385 345 445 345" fill="none" stroke="#edf3fa" stroke-width="3"/><circle cx="390" cy="345" r="5" fill="#edf3fa"/><circle cx="445" cy="345" r="5" fill="#edf3fa"/><path d="M775 345 C835 345 780 345 840 345" fill="none" stroke="#edf3fa" stroke-width="3"/><circle cx="775" cy="345" r="5" fill="#edf3fa"/><circle cx="840" cy="345" r="5" fill="#edf3fa"/><path d="M390 550 C450 550 440 550 500 550" fill="none" stroke="#edf3fa" stroke-width="3"/><circle cx="390" cy="550" r="5" fill="#edf3fa"/><circle cx="500" cy="550" r="5" fill="#edf3fa"/><g transform="translate(30 110)"><rect width="330" height="81" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H322 Q330 0 330 8 V38 H0 V8 Q0 0 8 0" fill="#74313f"/><text x="15" y="25" font-size="14" font-weight="700">UMG：请求关闭（项目事件）</text><text x="16" y="64" font-size="14" fill="#dce7f2">例如背景按钮 OnClicked</text></g><g transform="translate(435 110)"><rect width="330" height="107" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H322 Q330 0 330 8 V38 H0 V8 Q0 0 8 0" fill="#265e85"/><text x="15" y="25" font-size="14" font-weight="700">PetCloseConfigWidget</text><text x="16" y="64" font-size="14" fill="#dce7f2">Target = PetRef</text><text x="16" y="90" font-size="14" fill="#dce7f2">插件调用下方接口函数</text></g><g transform="translate(30 320)"><rect width="360" height="107" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H352 Q360 0 360 8 V38 H0 V8 Q0 0 8 0" fill="#74313f"/><text x="15" y="25" font-size="14" font-weight="700">PetRequestMenuClose（函数覆写）</text><text x="16" y="64" font-size="14" fill="#dce7f2">此接口有 bool 返回值</text><text x="16" y="90" font-size="14" fill="#dce7f2">在 UMG 的接口函数图中实现</text></g><g transform="translate(445 320)"><rect width="330" height="107" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H322 Q330 0 330 8 V38 H0 V8 Q0 0 8 0" fill="#265e85"/><text x="15" y="25" font-size="14" font-weight="700">Play Animation</text><text x="16" y="64" font-size="14" fill="#dce7f2">In Animation = 项目菜单动画</text><text x="16" y="90" font-size="14" fill="#dce7f2">Play Mode = Reverse</text></g><g transform="translate(840 320)"><rect width="330" height="107" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H322 Q330 0 330 8 V38 H0 V8 Q0 0 8 0" fill="#5d4a2f"/><text x="15" y="25" font-size="14" font-weight="700">Return Node</text><text x="16" y="64" font-size="14" fill="#dce7f2">Return Value = true</text><text x="16" y="90" font-size="14" fill="#dce7f2">表示动画结束后由 UMG 完成关闭</text></g><g transform="translate(30 525)"><rect width="360" height="81" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H352 Q360 0 360 8 V38 H0 V8 Q0 0 8 0" fill="#74313f"/><text x="15" y="25" font-size="14" font-weight="700">菜单动画播放完成</text><text x="16" y="64" font-size="14" fill="#dce7f2">关闭状态标记为 true 才继续</text></g><g transform="translate(500 525)"><rect width="390" height="107" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H382 Q390 0 390 8 V38 H0 V8 Q0 0 8 0" fill="#265e85"/><text x="15" y="25" font-size="14" font-weight="700">PetCompleteConfigWidgetClose</text><text x="16" y="64" font-size="14" fill="#dce7f2">Target = PetRef</text><text x="16" y="90" font-size="14" fill="#dce7f2">立即移除菜单，恢复人物交互</text></g><text x="40" y="275" font-size="15" fill="#afc1d2">打开：PetOpenConfigWidget → PetGetConfigWidget → Cast 到项目菜单类 → 设置 PetRef。</text>
<text x="30" y="668" fill="#8fa7bd" font-size="13">白线：执行顺序　蓝线：对象或结构体　红线：布尔值　图中为接线示意，节点名称对应插件接口</text>
</g></svg>