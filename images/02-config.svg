<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">02 / 改尺寸限制并保存</title><desc id="desc">所有 Target = PetRef。每次 Setter 都保留其他配置，窗口在下一 Tick 应用；保存包含待应用值。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0 H0 V24" fill="none" stroke="#253447" stroke-width=".5"/></pattern></defs>
<rect width="1200" height="650" fill="#0e1824"/><rect width="1200" height="650" fill="url(#grid)"/>
<g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#f4f8fc">
<text x="30" y="38" font-size="24" font-weight="700">02 / 改尺寸限制并保存</text>
<text x="30" y="70" font-size="15" fill="#afc1d2">所有 Target = PetRef。每次 Setter 都保留其他配置，窗口在下一 Tick 应用；保存包含待应用值。</text>
<path d="M360 135 C420 135 375 135 435 135" fill="none" stroke="#edf3fa" stroke-width="3"/><circle cx="360" cy="135" r="5" fill="#edf3fa"/><circle cx="435" cy="135" r="5" fill="#edf3fa"/><path d="M765 135 C825 135 780 135 840 135" fill="none" stroke="#edf3fa" stroke-width="3"/><circle cx="765" cy="135" r="5" fill="#edf3fa"/><circle cx="840" cy="135" r="5" fill="#edf3fa"/><path d="M1005 217 V275 H1005 V330" fill="none" stroke="#edf3fa" stroke-width="3"/><circle cx="1005" cy="217" r="5" fill="#edf3fa"/><circle cx="1005" cy="330" r="5" fill="#edf3fa"/><path d="M840 355 C900 355 705 355 765 355" fill="none" stroke="#edf3fa" stroke-width="3"/><circle cx="840" cy="355" r="5" fill="#edf3fa"/><circle cx="765" cy="355" r="5" fill="#edf3fa"/><path d="M435 355 C495 355 300 355 360 355" fill="none" stroke="#edf3fa" stroke-width="3"/><circle cx="435" cy="355" r="5" fill="#edf3fa"/><circle cx="360" cy="355" r="5" fill="#edf3fa"/><path d="M435 394 C495 394 300 394 360 394" fill="none" stroke="#ed7a89" stroke-width="3"/><circle cx="435" cy="394" r="5" fill="#ed7a89"/><circle cx="360" cy="394" r="5" fill="#ed7a89"/><g transform="translate(30 110)"><rect width="330" height="107" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H322 Q330 0 330 8 V38 H0 V8 Q0 0 8 0" fill="#74313f"/><text x="15" y="25" font-size="14" font-weight="700">应用设置（项目自定义事件）</text><text x="16" y="64" font-size="14" fill="#dce7f2">MinimumScale / MaximumScale</text><text x="16" y="90" font-size="14" fill="#dce7f2">MinSize / MaxSize</text></g><g transform="translate(435 110)"><rect width="330" height="107" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H322 Q330 0 330 8 V38 H0 V8 Q0 0 8 0" fill="#265e85"/><text x="15" y="25" font-size="14" font-weight="700">PetSetDisplayScaleLimits</text><text x="16" y="64" font-size="14" fill="#dce7f2">Minimum = 0.25</text><text x="16" y="90" font-size="14" fill="#dce7f2">Maximum = 3.0</text></g><g transform="translate(840 110)"><rect width="330" height="107" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H322 Q330 0 330 8 V38 H0 V8 Q0 0 8 0" fill="#265e85"/><text x="15" y="25" font-size="14" font-weight="700">PetSetWindowSizeLimits</text><text x="16" y="64" font-size="14" fill="#dce7f2">Minimum = (300, 300)</text><text x="16" y="90" font-size="14" fill="#dce7f2">Maximum = (1000, 1000)</text></g><g transform="translate(840 330)"><rect width="330" height="107" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H322 Q330 0 330 8 V38 H0 V8 Q0 0 8 0" fill="#265e85"/><text x="15" y="25" font-size="14" font-weight="700">PetSetDisplayScale</text><text x="16" y="64" font-size="14" fill="#dce7f2">Scale = 用户选中的倍率</text><text x="16" y="90" font-size="14" fill="#dce7f2">仍受两组限制约束</text></g><g transform="translate(435 330)"><rect width="330" height="107" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H322 Q330 0 330 8 V38 H0 V8 Q0 0 8 0" fill="#265e85"/><text x="15" y="25" font-size="14" font-weight="700">PetSaveRuntimeConfig</text><text x="16" y="64" font-size="14" fill="#dce7f2">Return Value → Branch.Condition</text><text x="16" y="90" font-size="14" fill="#dce7f2">Error → 失败时显示的文字</text></g><g transform="translate(30 330)"><rect width="330" height="107" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H322 Q330 0 330 8 V38 H0 V8 Q0 0 8 0" fill="#5d4a2f"/><text x="15" y="25" font-size="14" font-weight="700">Branch</text><text x="16" y="64" font-size="14" fill="#dce7f2">True：保存完成</text><text x="16" y="90" font-size="14" fill="#dce7f2">False：显示 Error</text></g><text x="40" y="525" font-size="15" fill="#afc1d2">滑条范围：PetGetEffectiveDisplayScaleLimits → Slider.MinValue / MaxValue。</text><text x="40" y="557" font-size="15" fill="#afc1d2">PetRuntimeConfigApplied 是“已应用”的通知；不要在该通知里无条件再次设置同一份配置。</text><text x="40" y="589" font-size="15" fill="#afc1d2">仅修改单个字段时，也可以 Get Runtime Config → Set Members in Desktop Pet Config → Apply。</text>
<text x="30" y="628" fill="#8fa7bd" font-size="13">白线：执行顺序　蓝线：对象或结构体　红线：布尔值　图中为接线示意，节点名称对应插件接口</text>
</g></svg>