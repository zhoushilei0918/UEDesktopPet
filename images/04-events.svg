<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">04 / 获取真正命中的 Actor</title><desc id="desc">在 DesktopPetActor 子蓝图中添加事件覆写；UI 命中优先，菜单打开期间人物交互暂停。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0 H0 V24" fill="none" stroke="#253447" stroke-width=".5"/></pattern></defs>
<rect width="1200" height="470" fill="#0e1824"/><rect width="1200" height="470" fill="url(#grid)"/>
<g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#f4f8fc">
<text x="30" y="38" font-size="24" font-weight="700">04 / 获取真正命中的 Actor</text>
<text x="30" y="70" font-size="15" fill="#afc1d2">在 DesktopPetActor 子蓝图中添加事件覆写；UI 命中优先，菜单打开期间人物交互暂停。</text>
<path d="M380 150 C440 150 390 150 450 150" fill="none" stroke="#edf3fa" stroke-width="3"/><circle cx="380" cy="150" r="5" fill="#edf3fa"/><circle cx="450" cy="150" r="5" fill="#edf3fa"/><path d="M380 189 C440 189 390 189 450 189" fill="none" stroke="#73cff3" stroke-width="3"/><circle cx="380" cy="189" r="5" fill="#73cff3"/><circle cx="450" cy="189" r="5" fill="#73cff3"/><path d="M750 150 C810 150 770 150 830 150" fill="none" stroke="#edf3fa" stroke-width="3"/><circle cx="750" cy="150" r="5" fill="#edf3fa"/><circle cx="830" cy="150" r="5" fill="#edf3fa"/><g transform="translate(30 125)"><rect width="350" height="81" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H342 Q350 0 350 8 V38 H0 V8 Q0 0 8 0" fill="#74313f"/><text x="15" y="25" font-size="14" font-weight="700">PetEventActorLeftClicked</text><text x="16" y="64" font-size="14" fill="#dce7f2">Actor：本次命中的场景对象</text></g><g transform="translate(450 125)"><rect width="300" height="107" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H292 Q300 0 300 8 V38 H0 V8 Q0 0 8 0" fill="#5d4a2f"/><text x="15" y="25" font-size="14" font-weight="700">Is Valid（带执行引脚）</text><text x="16" y="64" font-size="14" fill="#dce7f2">Input Object ← Actor</text><text x="16" y="90" font-size="14" fill="#dce7f2">Is Valid / Is Not Valid</text></g><g transform="translate(830 125)"><rect width="330" height="107" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H322 Q330 0 330 8 V38 H0 V8 Q0 0 8 0" fill="#2d6251"/><text x="15" y="25" font-size="14" font-weight="700">项目交互逻辑</text><text x="16" y="64" font-size="14" fill="#dce7f2">用 Actor 引用选择角色或道具</text><text x="16" y="90" font-size="14" fill="#dce7f2">按项目需求调用自己的接口</text></g><text x="40" y="330" font-size="15" fill="#afc1d2">另一个蓝图中：对 PetRef 使用 Bind Event to PetActorLeftClicked，再连接签名为 Actor 的自定义事件。</text><text x="40" y="365" font-size="15" fill="#afc1d2">一次行为选择事件覆写或委托绑定其中一种；两种都处理同一逻辑，会收到两次业务调用。</text><text x="40" y="400" font-size="15" fill="#afc1d2">只响应可见名单：VisibleActors / VisibleComponents / VisibleActorTag / 本宿主组件收集结果。</text>
<text x="30" y="448" fill="#8fa7bd" font-size="13">白线：执行顺序　蓝线：对象或结构体　红线：布尔值　图中为接线示意，节点名称对应插件接口</text>
</g></svg>