<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">07 / 整组配置：只改需要的字段</title><desc id="desc">Get 返回结构体副本。使用局部变量保存，再 Set Members，最后 Apply；不要用默认结构体覆盖其他运行值。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0 H0 V24" fill="none" stroke="#253447" stroke-width=".5"/></pattern></defs>
<rect width="1200" height="600" fill="#0e1824"/><rect width="1200" height="600" fill="url(#grid)"/>
<g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#f4f8fc">
<text x="30" y="38" font-size="24" font-weight="700">07 / 整组配置：只改需要的字段</text>
<text x="30" y="70" font-size="15" fill="#afc1d2">Get 返回结构体副本。使用局部变量保存，再 Set Members，最后 Apply；不要用默认结构体覆盖其他运行值。</text>
<path d="M390 174 C450 174 390 174 450 174" fill="none" stroke="#73cff3" stroke-width="3"/><circle cx="390" cy="174" r="5" fill="#73cff3"/><circle cx="450" cy="174" r="5" fill="#73cff3"/><path d="M390 335 V275 H450 V135" fill="none" stroke="#edf3fa" stroke-width="3"/><circle cx="390" cy="335" r="5" fill="#edf3fa"/><circle cx="450" cy="135" r="5" fill="#edf3fa"/><path d="M615 191 V250 H615 V310" fill="none" stroke="#edf3fa" stroke-width="3"/><circle cx="615" cy="191" r="5" fill="#edf3fa"/><circle cx="615" cy="310" r="5" fill="#edf3fa"/><path d="M840 335 C900 335 830 335 890 335" fill="none" stroke="#edf3fa" stroke-width="3"/><circle cx="840" cy="335" r="5" fill="#edf3fa"/><circle cx="890" cy="335" r="5" fill="#edf3fa"/><path d="M840 374 C900 374 830 374 890 374" fill="none" stroke="#73cff3" stroke-width="3"/><circle cx="840" cy="374" r="5" fill="#73cff3"/><circle cx="890" cy="374" r="5" fill="#73cff3"/><g transform="translate(30 110)"><rect width="360" height="107" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H352 Q360 0 360 8 V38 H0 V8 Q0 0 8 0" fill="#2d6251"/><text x="15" y="25" font-size="14" font-weight="700">PetGetRuntimeConfig（纯函数）</text><text x="16" y="64" font-size="14" fill="#dce7f2">Target = PetRef</text><text x="16" y="90" font-size="14" fill="#dce7f2">Return Value → 局部变量 Config</text></g><g transform="translate(450 110)"><rect width="330" height="81" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H322 Q330 0 330 8 V38 H0 V8 Q0 0 8 0" fill="#265e85"/><text x="15" y="25" font-size="14" font-weight="700">Set Config（局部变量）</text><text x="16" y="64" font-size="14" fill="#dce7f2">Config ← 当前配置副本</text></g><g transform="translate(450 310)"><rect width="390" height="133" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H382 Q390 0 390 8 V38 H0 V8 Q0 0 8 0" fill="#265e85"/><text x="15" y="25" font-size="14" font-weight="700">Set Members in DesktopPetConfig</text><text x="16" y="64" font-size="14" fill="#dce7f2">Struct Ref = 局部变量 Config</text><text x="16" y="90" font-size="14" fill="#dce7f2">仅勾选要改的字段</text><text x="16" y="116" font-size="14" fill="#dce7f2">例如 bCaptureTranslucency = true</text></g><g transform="translate(30 310)"><rect width="360" height="81" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H352 Q360 0 360 8 V38 H0 V8 Q0 0 8 0" fill="#74313f"/><text x="15" y="25" font-size="14" font-weight="700">应用按钮 / 自定义事件</text><text x="16" y="64" font-size="14" fill="#dce7f2">执行 → Set Config → Set Members</text></g><g transform="translate(890 310)"><rect width="280" height="107" rx="8" fill="#192636" stroke="#4c6076"/><path d="M8 0 H272 Q280 0 280 8 V38 H0 V8 Q0 0 8 0" fill="#265e85"/><text x="15" y="25" font-size="14" font-weight="700">PetApplyRuntimeConfig</text><text x="16" y="64" font-size="14" fill="#dce7f2">Target = PetRef</text><text x="16" y="90" font-size="14" fill="#dce7f2">Config ← 修改后的局部变量</text></g><text x="40" y="520" font-size="15" fill="#afc1d2">同一流程可设置退出策略、半透明、加法特效等没有独立 Setter 的字段；存档另接 PetSaveRuntimeConfig。</text>
<text x="30" y="578" fill="#8fa7bd" font-size="13">白线：执行顺序　蓝线：对象或结构体　红线：布尔值　图中为接线示意，节点名称对应插件接口</text>
</g></svg>